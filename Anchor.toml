[toolchain]
anchor_version = "1.2.1"
solana_version = "4.1.2"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
tesa_policy = "9oTWN6zV7bZfdqtSNRXJ92tSmuGJLqaetsGTQkC2L8wB"
mock_swap = "2khHAreRkYwwB2RTEJMzcsfsYdV9N1Pepp3Win8sxKUB"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Squads v4 copiada da mainnet (M2): `solana program dump -u m SQDS4ep65T869zMMBKyuUq6aD6EgTu8psMjkvj52pCf`
# e a ProgramConfig (`solana account -u m BSTq9w3k… --output json`), exigida pelo multisig_create_v2.
[[test.genesis]]
address = "SQDS4ep65T869zMMBKyuUq6aD6EgTu8psMjkvj52pCf"
program = "tests/fixtures/squads_v4.so"

[[test.validator.account]]
address = "BSTq9w3kZwNwpBXJEvTZz2G9ZTNyKBvoSeXMvwb4cNZr"
filename = "tests/fixtures/squads_program_config.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
